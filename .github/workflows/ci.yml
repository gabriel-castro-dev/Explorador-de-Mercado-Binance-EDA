name: CI

on:
  pull_request:
    paths:
      - "back-end/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "back-end/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "back-end/uv.lock"

      - name: Sync dependencies (incl. dev e ml groups)
        run: uv sync --frozen --group ml

      - name: Run tests
        run: uv run pytest

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "back-end/uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  changes:
    name: Detect Docker-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'back-end/Dockerfile.jobs'
              - 'back-end/Dockerfile.feature-engineering'
              - 'back-end/Dockerfile.api'
              - 'back-end/Dockerfile.ml'
              - 'back-end/pyproject.toml'
              - 'back-end/uv.lock'

  docker-smoke:
    name: Docker build smoke (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.jobs
            image: crypto-jobs
          - dockerfile: Dockerfile.feature-engineering
            image: crypto-feature-engineering
          - dockerfile: Dockerfile.api
            image: crypto-api
          - dockerfile: Dockerfile.ml
            image: crypto-ml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: back-end
          file: back-end/${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
