name: Pipeline de Coleta de Dados Crypto (Docker)

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 * * * *'
    - cron: '5 0 * * *'
    - cron: '0 2 * * 1'   # segunda 02:00 UTC — avaliação realizada do ML

  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Escolha qual rotina rodar manualmente'
        required: true
        default: 'hourly'
        type: choice
        options:
          - five-minutes
          - hourly
          - daily
          - feature-engineering
          - ml-forecast
          - ml-evaluate

permissions:
  contents: read
  packages: read

env:
  JOBS_IMAGE: ghcr.io/${{ github.repository }}/crypto-jobs:latest
  FE_IMAGE: ghcr.io/${{ github.repository }}/crypto-feature-engineering:latest
  ML_IMAGE: ghcr.io/${{ github.repository }}/crypto-ml:latest

jobs:
  five-minutes-job:
    name: Executar Coleta a Cada 5 Minutos
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job_to_run == 'five-minutes'
      || github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: crypto-five-minutes
      cancel-in-progress: true # snapshot atrasado é inútil quando o próximo tick chega

    steps:
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull da imagem pré-construída
        run: docker pull "$JOBS_IMAGE"

      - name: Activar Cloudflare WARP (Bypass Geoblock)
        uses: fscarmen/warp-on-actions@v1.4
        timeout-minutes: 3 # registro do WARP trava intermitentemente; falhar rápido e deixar o próximo tick recuperar
        with:
          stack: dual
          mode: wireguard

      - name: Rodar Job a Cada 5 Minutos
        run: |
          docker run --rm \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            -e BINANCE_API_KEY="${{ secrets.BINANCE_API_KEY }}" \
            -e BINANCE_API_SECRET="${{ secrets.BINANCE_API_SECRET }}" \
            -e BINANCE_PROXY="${{ secrets.BINANCE_PROXY }}" \
            "$JOBS_IMAGE" uv run python jobs.py five-minutes

  hourly-job:
    name: Executar Coleta Horária
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job_to_run == 'hourly'
      || github.event_name == 'schedule' && github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: crypto-hourly
      cancel-in-progress: false

    steps:
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull da imagem pré-construída
        run: docker pull "$JOBS_IMAGE"

      - name: Activar Cloudflare WARP (Bypass Geoblock)
        uses: fscarmen/warp-on-actions@v1.4
        timeout-minutes: 3 # registro do WARP trava intermitentemente; falhar rápido e deixar o próximo tick recuperar
        with:
          stack: dual
          mode: wireguard

      - name: Rodar Job Horário
        run: |
          docker run --rm \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            -e BINANCE_API_KEY="${{ secrets.BINANCE_API_KEY }}" \
            -e BINANCE_API_SECRET="${{ secrets.BINANCE_API_SECRET }}" \
            -e BINANCE_PROXY="${{ secrets.BINANCE_PROXY }}" \
            "$JOBS_IMAGE" uv run python jobs.py hourly

  daily-job:
    name: Executar Coleta Diária
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job_to_run == 'daily'
      || github.event_name == 'schedule' && github.event.schedule == '5 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: crypto-daily
      cancel-in-progress: false

    steps:
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull da imagem pré-construída
        run: docker pull "$JOBS_IMAGE"

      # NOVO: o job diário busca klines na Binance (jobs.py -> BinanceMarketService);
      # sem WARP ele só funciona se BINANCE_PROXY estiver ativo ou o runner cair
      # fora de região bloqueada. Igualado aos demais jobs por consistência.
      - name: Activar Cloudflare WARP (Bypass Geoblock)
        uses: fscarmen/warp-on-actions@v1.4
        timeout-minutes: 3 # registro do WARP trava intermitentemente; falhar rápido e deixar o próximo tick recuperar
        with:
          stack: dual
          mode: wireguard

      - name: Rodar Job Diário
        run: |
          docker run --rm \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            -e BINANCE_API_KEY="${{ secrets.BINANCE_API_KEY }}" \
            -e BINANCE_API_SECRET="${{ secrets.BINANCE_API_SECRET }}" \
            -e BINANCE_PROXY="${{ secrets.BINANCE_PROXY }}" \
            "$JOBS_IMAGE" uv run python jobs.py daily

  feature-engineering-job:
    name: Construir Features e Aplicar Retenção
    needs: daily-job
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.job_to_run == 'feature-engineering' ||
        github.event_name == 'schedule' &&
        github.event.schedule == '5 0 * * *' &&
        needs.daily-job.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: crypto-feature-engineering
      cancel-in-progress: false

    steps:
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull da imagem pré-construída
        run: docker pull "$FE_IMAGE"

      - name: Construir features e limpar dados expirados
        run: |
          docker run --rm \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            -e BINANCE_API_KEY="${{ secrets.BINANCE_API_KEY }}" \
            -e BINANCE_API_SECRET="${{ secrets.BINANCE_API_SECRET }}" \
            -e BINANCE_PROXY="${{ secrets.BINANCE_PROXY }}" \
            "$FE_IMAGE"

  ml-forecast-job:
    name: Treinar Modelo e Publicar Previsões (ML)
    needs: feature-engineering-job
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.job_to_run == 'ml-forecast') ||
        (github.event_name == 'schedule' &&
         github.event.schedule == '5 0 * * *' &&
         needs.feature-engineering-job.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: crypto-ml-forecast
      cancel-in-progress: false

    steps:
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull da imagem pré-construída
        run: docker pull "$ML_IMAGE"

      # Sem WARP nem chaves da Binance: este job só fala com o Supabase.
      - name: Treinar candidatos, aplicar gate e publicar previsões
        run: |
          docker run --rm \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            -e GITHUB_SHA="${{ github.sha }}" \
            "$ML_IMAGE"

  ml-evaluate-job:
    name: Avaliar Previsões Realizadas (Monitoramento ML)
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job_to_run == 'ml-evaluate'
      || github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: crypto-ml-evaluate
      cancel-in-progress: false

    steps:
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull da imagem pré-construída
        run: docker pull "$ML_IMAGE"

      # Exit != 0 quando o modelo publicado perde do naive no realizado por
      # K versões seguidas — a degradação fica vermelha aqui no Actions.
      - name: Pontuar previsões passadas contra o realizado
        run: |
          docker run --rm \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            "$ML_IMAGE" python -m app.ml.main evaluate
