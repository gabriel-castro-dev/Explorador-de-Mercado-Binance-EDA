name: Publish images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "back-end/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch: # bootstrap da primeira publicação

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false # nunca cancelar um publish no meio; runs enfileiram

jobs:
  build-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.jobs
            image: crypto-jobs
          - dockerfile: Dockerfile.feature-engineering
            image: crypto-feature-engineering
          - dockerfile: Dockerfile.api
            image: crypto-api
          - dockerfile: Dockerfile.ml
            image: crypto-ml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels OCI)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: back-end
          file: back-end/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
