[project]
name = "cripto-forecasting-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "python-binance>=1.0.37",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "supabase>=2.31.0",
    "ta-lib>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
