# Fixed universe of tracked trading pairs.
#
# Snapshot of the top-20 USDT pairs by 24h quote volume, taken from
# ticker_24hr_history on 2026-08-19. Freezing the list keeps the ML dataset
# stable: symbols no longer rotate in/out of the daily jobs, so the series
# have no gaps. Symbols listed on Binance after the backfill horizon simply
# start at their listing date.
