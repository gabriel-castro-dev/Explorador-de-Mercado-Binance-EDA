# Fixed universe of tracked trading pairs.
#
# Snapshot of the top-20 USDT pairs on the REAL Binance exchange by 24h
# quote volume, taken on 2026-08-19 after the testnet -> real-data
# migration. Stablecoin-quoted-in-USDT pairs (USDC, FDUSD, USD1, RLUSD…)
# are excluded: a pegged pair has nothing to forecast.
#
# Freezing the list keeps the ML dataset stable: symbols no longer rotate
# in/out of the daily jobs, so the series have no gaps. Symbols listed on
# Binance after the backfill horizon simply start at their listing date.
#
# Editing this list changes what the daily jobs ingest AND what the backfill
# targets. Removing a symbol stops new data; its history stays until cleaned.
# Delete this file (or empty the list) to fall back to the dynamic top-20.
